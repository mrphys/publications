<div class="post-preview item" data-tags="{{ with .Params.tags }} {{- delimit  (apply (apply . "lower" ".") "urlquery" ".") "," -}} {{ end }}" style="padding-bottom: 0.5em;">
  <a href="{{ .RelPermalink }}">
      <h4 class="post-title">{{ .Title }}</h4>
      {{ with .Page.Params.subtitle }}
        <p class="post-subtitle" style="font-size: 0.8em; margin-bottom: 0.5em; margin-top: 0.5em;">
          {{ . }}
        </p>
      {{ end }}
  </a>
  <hr>
</div>
