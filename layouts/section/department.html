{{ define "main" }}
<div class="container">
  <div class="row">
    <div class="col-lg-12 col-md-10 ">

      <!-- Breadcrumb Navigation -->
      <nav aria-label="breadcrumb" class="mt-4" style="padding-top: 2rem;">
        <ol class="breadcrumb p-3 rounded" style="font-size: 2rem; margin-left: 0; padding-left: 0;">
          <li class="breadcrumb-item"><a href="/publications/">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
        </ol>
      </nav>

      <!-- Page List -->
      <ul class="list-unstyled p-3" 
          style="font-size: 2rem; margin-top: 2em; margin-left: 0; padding-left: 0;">
        {{ range .Pages }}
          {{ .Render "li" }}
        {{ end }}
      </ul>

    </div>
  </div>
</div>
{{ end }}
